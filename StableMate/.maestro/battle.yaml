# B1, B2, B7: a win pays a prize, a loss marks down, and a result survives a force-quit.
appId: com.wwdrew.StableMate
name: Battles
tags: [smoke]
---
- runFlow: subflows/start-game.yaml
- runFlow:
    file: subflows/set-overrides.yaml
    env:
      BATTLE: Always win

# B1: win.
- tapOn: "Stable"
- tapOn: "Squirtle, .*"
- scrollUntilVisible:
    element: "Battle"
- tapOn: "Battle"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 15000
- assertVisible: "Squirtle wins"
- copyTextFrom: "Prize \\+\\$\\d+"
- evalScript: ${output.prize = maestro.copiedText.match(/[0-9][0-9,]*/)[0]}
- tapOn: "Continue"
# Scroll back up to the record; Android's detail is a full page, so it may be off screen.
- scrollUntilVisible:
    element: "Water, 1 win, 0 losses"
    direction: UP
- assertVisible: "\\$459"
- assertVisible: "Win · \\+\\$${output.prize}"
- runFlow: subflows/close-modal.yaml

- tapOn: "History"
- assertVisible: "PRIZE, Battle prize, Squirtle beat .*, \\+\\$${output.prize}, Balance \\$${output.prize}"
- assertVisible: "1 transaction"
- tapOn: "Overview"
- assertVisible: "\\$${output.prize}"

# B2: loss.
- runFlow:
    file: subflows/set-overrides.yaml
    env:
      BATTLE: Always lose
- tapOn: "Stable"
- tapOn: "Squirtle, .*"
- scrollUntilVisible:
    element: "Battle"
- tapOn: "Battle"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 15000
- assertVisible: "No prize this round"
- tapOn: "Continue"
# Scroll back up to the record; Android's detail is a full page, so it may be off screen.
- scrollUntilVisible:
    element: "Water, 1 win, 1 loss"
    direction: UP
- assertVisible: "\\$433"
- runFlow: subflows/close-modal.yaml

# B7: quit mid-battle; the loss is already recorded.
- tapOn: "Stable"
- tapOn: "Squirtle, .*"
- scrollUntilVisible:
    element: "Battle"
- tapOn: "Battle"
- stopApp
- launchApp
# Android's dev build reloads the bundle on relaunch; wait for the tab bar.
- extendedWaitUntil:
    visible: "Stable"
    timeout: 90000
- tapOn: "Stable"
- extendedWaitUntil:
    visible: "Squirtle, Water, 1 win, 2 losses, .*"
    timeout: 30000
