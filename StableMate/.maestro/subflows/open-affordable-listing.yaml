# Battles (set "Always win" first) until a listing is affordable, and leaves
# its detail open. The lot refreshes each round, so this always converges.
appId: com.wwdrew.StableMate
---
- tapOn: "Buy"
- tapOn:
    text: ".*, [0-9]+ wins?, [0-9]+ loss(es)?, \\$.*"
    index: 0
# The buy button (and any "Insufficient funds" note above it) can sit below the fold.
- scrollUntilVisible:
    element: "Buy · .*"
- repeat:
    while:
      visible: "Insufficient funds.*"
    commands:
      - runFlow: close-modal.yaml
      - runFlow: battle.yaml
      - tapOn: "Buy"
      - tapOn:
          text: ".*, [0-9]+ wins?, [0-9]+ loss(es)?, \\$.*"
          index: 0
      - scrollUntilVisible:
          element: "Buy · .*"
- copyTextFrom: "Buy · \\$.*"
- evalScript: ${output.price = maestro.copiedText.match(/[0-9][0-9,]*/)[0]}
