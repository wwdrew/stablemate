# Dismiss a detail modal: swipe it down on iOS; Android shows it as a full
# screen, so go back.
appId: com.wwdrew.StableMate
---
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 12%
          end: 50%, 90%
- runFlow:
    when:
      platform: Android
    commands:
      - back
- waitForAnimationToEnd
